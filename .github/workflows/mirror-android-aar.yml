name: Mirror Android AAR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Avvessa version already published to Maven Central
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mirror-android-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable release versions are supported." >&2
            exit 1
          fi

      - name: Check out publication tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: verifier
          persist-credentials: false

      - name: Check out the accepted release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Download accepted metadata and all Maven Central AARs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            | jq -e --arg version "$VERSION" \
              '.isDraft == false and .isPrerelease == false and .tagName == $version' >/dev/null
          mkdir -p dist
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "avvessa-native-$VERSION.json" --dir dist
          for artifact in avvessa avvessa-xiaomi avvessa-huawei avvessa-oppo avvessa-vivo avvessa-honor avvessa-meizu avvessa-fcm; do
            curl --fail --location --retry 20 --retry-all-errors --retry-delay 15 \
              --output "dist/$artifact-$VERSION.aar" \
              "https://repo1.maven.org/maven2/io/github/sandroxy/$artifact/$VERSION/$artifact-$VERSION.aar"
          done

      - name: Verify the accepted native bytes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 verifier/scripts/verify-release-artifacts.py \
            --version "$VERSION" --source release-source --artifacts dist --channel android
          for module in avvessa avvessa-xiaomi avvessa-huawei avvessa-oppo avvessa-vivo avvessa-honor avvessa-meizu avvessa-fcm; do
            (cd dist && sha256sum "$module-$VERSION.aar" > "$module-$VERSION.aar.sha256")
          done

      - name: Attach verified offline mirrors without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > existing-assets.txt
          assets=()
          for module in avvessa avvessa-xiaomi avvessa-huawei avvessa-oppo avvessa-vivo avvessa-honor avvessa-meizu avvessa-fcm; do
            for artifact in "$module-$VERSION.aar" "$module-$VERSION.aar.sha256"; do
              if grep -Fxq "$artifact" existing-assets.txt; then
                echo "Release already contains $artifact; inspect it without replacing public bytes." >&2
                exit 1
              fi
              assets+=("dist/$artifact")
            done
          done
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
