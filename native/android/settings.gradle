pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        maven { url = uri("https://developer.huawei.com/repo/"); content { includeGroupByRegex("com\\.huawei.*") } }
        maven { url = uri("https://developer.hihonor.com/repo/"); content { includeGroupByRegex("com\\.hihonor.*") } }
    }
}
rootProject.name = "AvvessaAndroid"
include(":avvessa")
["xiaomi", "huawei", "oppo", "vivo", "honor", "meizu", "fcm"].each { include(":avvessa-" + it) }
