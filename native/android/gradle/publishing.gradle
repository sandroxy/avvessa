apply plugin: "maven-publish"
group = rootProject.ext.avvessaManifest.native.android.group
version = rootProject.ext.avvessaManifest.version
android.publishing { singleVariant("release") { withSourcesJar(); withJavadocJar() } }
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = project.name
                pom {
                    name = project.name
                    description = "Framework-independent JPush integration for Android"
                    url = "https://github.com/sandroxy/avvessa"
                    licenses { license {
                        name = "Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    } }
                    developers { developer { id = "sandroxy"; name = "SandroX" } }
                    scm {
                        url = "https://github.com/sandroxy/avvessa"
                        connection = "scm:git:https://github.com/sandroxy/avvessa.git"
                        developerConnection = "scm:git:ssh://git@github.com/sandroxy/avvessa.git"
                    }
                }
            }
        }
        repositories { maven {
            name = "Candidate"
            url = uri(rootProject.findProperty("avvessaCandidateRepository") ?: rootProject.layout.buildDirectory.dir("maven").get().asFile)
        } }
    }
}
