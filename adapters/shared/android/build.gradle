plugins { id "com.android.library" }
android {
    namespace "com.sandrox.avvessa.bridge"
    compileSdk 36
    defaultConfig { minSdk 21; consumerProguardFiles "consumer-rules.pro" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    compileOnly files(providers.gradleProperty("avvessaCoreAar").get())
    testImplementation files(providers.gradleProperty("avvessaCoreAar").get())
    def metadata = new groovy.json.JsonSlurper().parse(rootProject.file('../../plugin.json'))
    testImplementation "cn.jiguang.sdk:jpush:${metadata.native.android.jpush}"
    testImplementation "cn.jiguang.sdk:jcore:${metadata.native.android.jcore}"
    testImplementation "androidx.core:core:1.13.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}
